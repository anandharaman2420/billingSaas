spring:
  application:
    name: billing-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billing_saas}
    username: ${DB_USERNAME:billing_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2

  # Optional - EmailService (see notification/EmailService.java) logs and
  # continues instead of throwing when this isn't configured, so the app
  # runs fine in dev without a real SMTP provider. Set these to enable
  # real password-reset/invoice/reminder emails.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 30
        default_batch_fetch_size: 30

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET}                     # required - min 256-bit random string, no default in code
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}     # 15 min
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    issuer: ${JWT_ISSUER:billing-saas}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  security:
    bcrypt-strength: 12

  mail:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@billingsaas.local}
    from-name: ${MAIL_FROM_NAME:Billing SaaS}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}

  scheduled:
    overdue-sweep-cron: ${OVERDUE_SWEEP_CRON:0 0 1 * * *}       # 1 AM daily
    payment-reminder-cron: ${PAYMENT_REMINDER_CRON:0 0 8 * * *} # 8 AM daily

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.saasbilling: ${APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
