spring:
  application:
    name: billing-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billing_saas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2

  # Optional - EmailService (see notification/EmailService.java) logs and
  # continues instead of throwing when this isn't configured, so the app
  # runs fine in dev without a real SMTP provider. Set these to enable
  # real password-reset/invoice/reminder emails.
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:anandharaman242@gmail.com}
    password: ${SMTP_PASSWORD:oosxsghdiypfubju}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 30
        default_batch_fetch_size: 30

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:tdRIXxH/8ZUIoTD8aOeQVKZb8/JfMBAUM+c8/VT5fvM=}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}     # 15 min
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    issuer: ${JWT_ISSUER:billing-saas}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  security:
    bcrypt-strength: 12

  mail:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@billingsaas.local}
    from-name: ${MAIL_FROM_NAME:Billing SaaS}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}

  scheduled:
    overdue-sweep-cron: ${OVERDUE_SWEEP_CRON:0 0 1 * * *}       # 1 AM daily
    payment-reminder-cron: ${PAYMENT_REMINDER_CRON:0 0 8 * * *} # 8 AM daily
    payment-reminder-throttle-days: ${PAYMENT_REMINDER_THROTTLE_DAYS:3}

  storage:
    # See com.saasbilling.storage.FileStorageService - local disk by default;
    # swap in an S3-compatible implementation for multi-instance production
    # (local disk doesn't survive a redeploy or scale past one instance).
    local-directory: ${UPLOAD_STORAGE_DIRECTORY:./uploads}
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:/api/files}

  razorpay:
    # Optional. Blank = plan changes stay on the MANUAL provider (no
    # payment collected); set key-id/key-secret to enable Razorpay checkout,
    # and webhook-secret so /api/webhooks/razorpay accepts real events.
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

  subscription:
    pricing:
      free: ${PLAN_PRICE_FREE:0}
      basic: ${PLAN_PRICE_BASIC:499}
      professional: ${PLAN_PRICE_PROFESSIONAL:1499}
      business: ${PLAN_PRICE_BUSINESS:3999}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.saasbilling: ${APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
