<div class="gs-wrapper" role="search" aria-label="Global search">
  <div class="gs-input-wrap">
    <span class="gs-icon" aria-hidden="true">🔍</span>
    <input
      type="search"
      class="gs-input"
      placeholder="Search customers, products, invoices… (Ctrl+K)"
      [(ngModel)]="query"
      (ngModelChange)="onInput()"
      (focus)="open.set(!!results())"
      aria-label="Global search"
      aria-autocomplete="list"
      [attr.aria-expanded]="open()"
      autocomplete="off"
    />
    <span class="gs-shortcut" aria-hidden="true">Ctrl K</span>
  </div>

  <div
    *ngIf="open() && results() as r"
    class="gs-dropdown"
    role="listbox"
    aria-label="Search results"
  >
    <div *ngIf="!hasAnyResults()" class="gs-empty">
      <span aria-hidden="true">🔍</span> No results for &ldquo;{{ query }}&rdquo;
    </div>

    <div *ngIf="r.customers.length > 0" class="gs-group">
      <div class="gs-group-label">👥 Customers</div>
      <div
        *ngFor="let c of r.customers"
        (click)="goTo(['/customers', c.id])"
        class="gs-item"
        role="option"
        tabindex="0"
        (keydown.enter)="goTo(['/customers', c.id])"
        [attr.aria-label]="c.name"
      >
        <span class="gs-item-name">{{ c.name }}</span>
        <span *ngIf="c.phone" class="gs-item-meta">📱 {{ c.phone }}</span>
      </div>
    </div>

    <div *ngIf="r.products.length > 0" class="gs-group">
      <div class="gs-group-label">📦 Products</div>
      <div
        *ngFor="let p of r.products"
        (click)="goTo(['/products', p.id])"
        class="gs-item"
        role="option"
        tabindex="0"
        (keydown.enter)="goTo(['/products', p.id])"
        [attr.aria-label]="p.name"
      >
        <span class="gs-item-name">{{ p.name }}</span>
        <span *ngIf="p.sku" class="gs-item-meta">SKU: {{ p.sku }}</span>
      </div>
    </div>

    <div *ngIf="r.services.length > 0" class="gs-group">
      <div class="gs-group-label">🔧 Services</div>
      <div
        *ngFor="let s of r.services"
        (click)="goTo(['/services', s.id])"
        class="gs-item"
        role="option"
        tabindex="0"
        (keydown.enter)="goTo(['/services', s.id])"
      >
        <span class="gs-item-name">{{ s.name }}</span>
      </div>
    </div>

    <div *ngIf="r.invoices.length > 0" class="gs-group">
      <div class="gs-group-label">📄 Invoices</div>
      <div
        *ngFor="let i of r.invoices"
        (click)="goTo(['/invoices', i.id])"
        class="gs-item"
        role="option"
        tabindex="0"
        (keydown.enter)="goTo(['/invoices', i.id])"
      >
        <span class="gs-item-name">{{ i.invoiceNumber || 'DRAFT' }}</span>
        <span class="gs-item-meta">₹{{ i.grandTotal | number: '1.2-2' }} &middot; {{ i.status }}</span>
      </div>
    </div>
  </div>
</div>

<style>
.gs-wrapper {
  position: relative;
  width: 100%;
  max-width: 400px;
}
.gs-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.gs-icon {
  position: absolute;
  left: 10px;
  font-size: 14px;
  pointer-events: none;
  color: var(--color-text-muted);
}
.gs-input {
  width: 100%;
  padding: 8px 70px 8px 34px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  background: var(--color-bg);
  color: var(--color-text);
  font-size: 13.5px;
  font-family: inherit;
  outline: none;
  transition: border-color 150ms, box-shadow 150ms;
}
.gs-input::placeholder {
  color: var(--color-text-light, #9ca3af);
}
.gs-input:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  background: var(--color-surface);
}
.gs-shortcut {
  position: absolute;
  right: 10px;
  font-size: 10px;
  color: var(--color-text-muted);
  background: var(--color-surface-2, #f0f4f8);
  border: 1px solid var(--color-border);
  border-radius: 4px;
  padding: 2px 6px;
  font-family: monospace;
  white-space: nowrap;
}
.gs-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg, 12px);
  box-shadow: var(--shadow-xl, 0 20px 25px rgba(0,0,0,0.1));
  max-height: 420px;
  overflow-y: auto;
  z-index: 9999;
}
.gs-empty {
  padding: 20px;
  text-align: center;
  color: var(--color-text-muted);
  font-size: 13px;
}
.gs-group {
  padding: 8px 0;
  border-bottom: 1px solid var(--color-border);
}
.gs-group:last-child {
  border-bottom: none;
}
.gs-group-label {
  padding: 6px 14px 4px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--color-text-muted);
}
.gs-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 14px;
  cursor: pointer;
  transition: background 120ms;
  gap: 10px;
}
.gs-item:hover, .gs-item:focus {
  background: var(--color-surface-2, #f0f4f8);
  outline: none;
}
.gs-item-name {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--color-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.gs-item-meta {
  font-size: 12px;
  color: var(--color-text-muted);
  white-space: nowrap;
  flex-shrink: 0;
}
</style>
