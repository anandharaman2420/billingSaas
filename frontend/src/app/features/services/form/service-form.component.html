<div class="page page-sm">
  <header class="page-header">
    <h1>{{ serviceId ? 'Edit Service' : 'Add Service' }}</h1>
    <a routerLink="/services" class="btn btn-secondary btn-sm" aria-label="Back to service list">← Back to Services</a>
  </header>

  <div class="card">
    <div class="alert-error" *ngIf="errorMessage()" role="alert">{{ errorMessage() }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-field">
        <label class="form-label">Service Name *</label>
        <input formControlName="serviceName" placeholder="e.g. Consultation / Installation / Annual Maintenance" />
      </div>

      <div class="form-field">
        <label class="form-label">Description</label>
        <textarea formControlName="description" placeholder="Scope of service, deliverables, etc."></textarea>
      </div>

      <div class="form-field">
        <label class="form-label">SAC Code (optional)</label>
        <input formControlName="sacCode" placeholder="998311" />
      </div>

      <div class="form-row">
        <div class="form-field">
          <label class="form-label">Price (₹) *</label>
          <input formControlName="price" type="number" min="0" step="0.01" placeholder="0.00" />
        </div>
        <div class="form-field">
          <label class="form-label">Tax Rate (%) *</label>
          <input formControlName="taxRatePercent" type="number" min="0" max="100" step="0.01" placeholder="18" />
        </div>
      </div>

      <div class="btn-group" style="margin-top: 8px;">
        <button type="submit" class="btn btn-primary" [disabled]="loading()">
          {{ loading() ? 'Saving…' : 'Save Service' }}
        </button>
        <a routerLink="/services" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
