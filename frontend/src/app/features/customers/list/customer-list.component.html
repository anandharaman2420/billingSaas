<div style="max-width: 960px; margin: 32px auto;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
    <h1 style="margin: 0;">Customers</h1>
    <a routerLink="/customers/new" class="btn-primary" style="text-decoration: none;">+ Add customer</a>
  </div>

  <input
    type="text"
    placeholder="Search by name, phone, email, or GSTIN…"
    [(ngModel)]="keyword"
    (ngModelChange)="onKeywordChange()"
    style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: var(--radius); margin-bottom: 16px;"
  />

  <div class="card" style="padding: 0; overflow: hidden;">
    <table style="width: 100%; border-collapse: collapse;">
      <thead>
        <tr style="text-align: left; border-bottom: 1px solid var(--color-border);">
          <th style="padding: 12px;">Name</th>
          <th style="padding: 12px;">Phone</th>
          <th style="padding: 12px;">Email</th>
          <th style="padding: 12px;">City</th>
          <th style="padding: 12px;">Status</th>
          <th style="padding: 12px;"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let customer of result()?.content" style="border-bottom: 1px solid var(--color-border);">
          <td style="padding: 12px;">
            <a [routerLink]="['/customers', customer.id]">{{ customer.customerName }}</a>
          </td>
          <td style="padding: 12px;">{{ customer.phone || '—' }}</td>
          <td style="padding: 12px;">{{ customer.email || '—' }}</td>
          <td style="padding: 12px;">{{ customer.city || '—' }}</td>
          <td style="padding: 12px;">{{ customer.status }}</td>
          <td style="padding: 12px; text-align: right;">
            <button *ngIf="customer.status === 'ACTIVE'" (click)="deactivate(customer)" style="cursor: pointer;">
              Deactivate
            </button>
            <button *ngIf="customer.status === 'INACTIVE'" (click)="reactivate(customer)" style="cursor: pointer;">
              Reactivate
            </button>
          </td>
        </tr>
        <tr *ngIf="!loading() && result()?.content?.length === 0">
          <td colspan="6" style="padding: 24px; text-align: center; color: var(--color-text-muted);">
            No customers found.
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px;">
    <span style="color: var(--color-text-muted);">
      {{ result()?.totalElements || 0 }} total
    </span>
    <div style="display: flex; gap: 8px;">
      <button (click)="prevPage()" [disabled]="result()?.first">Previous</button>
      <button (click)="nextPage()" [disabled]="result()?.last">Next</button>
    </div>
  </div>
</div>
