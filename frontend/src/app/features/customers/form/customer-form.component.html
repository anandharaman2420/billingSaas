<div class="page page-sm">
  <header class="page-header">
    <h1>{{ customerId ? 'Edit Customer' : 'Add Customer' }}</h1>
    <a routerLink="/customers" class="btn btn-secondary btn-sm" aria-label="Back to customer list">← Back to Customers</a>
  </header>

  <div class="card">
    <div class="alert-error" *ngIf="errorMessage()" role="alert">{{ errorMessage() }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-field">
        <label class="form-label">Customer Name *</label>
        <input formControlName="customerName" placeholder="e.g. Acme Corp / Ramesh Kumar" />
      </div>

      <div class="form-row">
        <div class="form-field">
          <label class="form-label">Phone</label>
          <input formControlName="phone" placeholder="9876543210" />
        </div>
        <div class="form-field">
          <label class="form-label">Email</label>
          <input formControlName="email" type="email" placeholder="customer@example.com" />
          <span class="form-error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
            Enter a valid email
          </span>
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">Address</label>
        <input formControlName="addressLine" placeholder="Shop / Building, Street" />
      </div>

      <div class="form-row">
        <div class="form-field">
          <label class="form-label">City</label>
          <input formControlName="city" placeholder="Mumbai" />
        </div>
        <div class="form-field">
          <label class="form-label">State</label>
          <input formControlName="state" placeholder="Maharashtra" />
        </div>
        <div class="form-field">
          <label class="form-label">Pincode</label>
          <input formControlName="pincode" placeholder="400001" />
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">GSTIN (optional)</label>
        <input formControlName="gstin" placeholder="27AAPFU0939F1ZV" />
      </div>

      <div class="form-field">
        <label class="form-label">Notes</label>
        <textarea formControlName="notes" placeholder="Customer specific notes, preferred terms, etc."></textarea>
      </div>

      <div class="btn-group" style="margin-top: 8px;">
        <button type="submit" class="btn btn-primary" [disabled]="loading()">
          {{ loading() ? 'Saving…' : 'Save Customer' }}
        </button>
        <a routerLink="/customers" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
