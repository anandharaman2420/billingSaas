<div style="max-width: 560px; margin: 32px auto;" class="card">
  <h1 style="margin-top: 0;">{{ productId ? 'Edit product' : 'Add product' }}</h1>

  <div class="alert-error" *ngIf="errorMessage()">{{ errorMessage() }}</div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-field">
      <label>Product name *</label>
      <input formControlName="productName" />
    </div>

    <div style="display: flex; gap: 12px;">
      <div class="form-field" style="flex: 1;">
        <label>SKU (optional)</label>
        <input formControlName="sku" />
      </div>
      <div class="form-field" style="flex: 1;">
        <label>Unit *</label>
        <input formControlName="unit" placeholder="PCS, KG, LTR…" />
      </div>
    </div>

    <div class="form-field">
      <label>Description</label>
      <input formControlName="description" />
    </div>

    <div style="display: flex; gap: 12px;">
      <div class="form-field" style="flex: 1;">
        <label>Purchase price (₹) *</label>
        <input formControlName="purchasePrice" type="number" min="0" step="0.01" />
      </div>
      <div class="form-field" style="flex: 1;">
        <label>Selling price (₹) *</label>
        <input formControlName="sellingPrice" type="number" min="0" step="0.01" />
      </div>
      <div class="form-field" style="flex: 1;">
        <label>Tax rate (%) *</label>
        <input formControlName="taxRatePercent" type="number" min="0" max="100" step="0.01" />
      </div>
    </div>

    <div style="display: flex; gap: 12px;">
      <div class="form-field" style="flex: 1;">
        <label>Stock quantity *</label>
        <input formControlName="stockQuantity" type="number" min="0" step="1" />
      </div>
      <div class="form-field" style="flex: 1;">
        <label>Minimum stock level *</label>
        <input formControlName="minimumStockLevel" type="number" min="0" step="1" />
      </div>
    </div>

    <button type="submit" class="btn-primary" [disabled]="loading()">
      {{ loading() ? 'Saving…' : 'Save product' }}
    </button>
  </form>
</div>
