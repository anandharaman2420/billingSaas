<div style="max-width: 480px; margin: 40px auto;" class="card">
  <h1 style="margin-top: 0;">Register your business</h1>

  <div class="alert-error" *ngIf="errorMessage()">{{ errorMessage() }}</div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-field">
      <label for="businessName">Business name</label>
      <input id="businessName" formControlName="businessName" />
    </div>

    <div class="form-field">
      <label for="ownerName">Owner name</label>
      <input id="ownerName" formControlName="ownerName" />
    </div>

    <div class="form-field">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
    </div>

    <div class="form-field">
      <label for="phone">Phone</label>
      <input id="phone" formControlName="phone" />
    </div>

    <div class="form-field">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password" />
      <span class="form-error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
        Minimum 8 characters
      </span>
    </div>

    <div class="form-field">
      <label for="city">City</label>
      <input id="city" formControlName="city" />
    </div>

    <div class="form-field">
      <label for="state">State</label>
      <input id="state" formControlName="state" />
    </div>

    <div class="form-field">
      <label for="gstin">GSTIN (optional)</label>
      <input id="gstin" formControlName="gstin" />
    </div>

    <button type="submit" class="btn-primary" [disabled]="loading()" style="width: 100%;">
      {{ loading() ? 'Creating account…' : 'Create account' }}
    </button>
  </form>

  <p style="margin-top: 16px; text-align: center;">
    Already registered? <a routerLink="/login">Sign in</a>
  </p>
</div>
