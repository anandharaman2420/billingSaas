<div class="page page-sm">
  <header class="page-header">
    <h1>{{ expenseId ? 'Edit Expense' : 'Add Expense' }}</h1>
    <a routerLink="/expenses" class="btn btn-secondary btn-sm" aria-label="Back to expense list">← Back to Expenses</a>
  </header>

  <div class="card">
    <div class="alert-error" *ngIf="errorMessage()" role="alert">{{ errorMessage() }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-field">
        <label class="form-label">Description *</label>
        <input formControlName="description" placeholder="e.g. Office electricity bill / Packaging material" />
      </div>

      <div class="form-row">
        <div class="form-field">
          <label class="form-label">Amount (₹) *</label>
          <input type="number" formControlName="amount" min="0.01" step="0.01" placeholder="0.00" />
        </div>
        <div class="form-field">
          <label class="form-label">Date *</label>
          <input type="date" formControlName="expenseDate" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label class="form-label">Category</label>
          <select formControlName="categoryId">
            <option value="">Uncategorized</option>
            <option *ngFor="let c of categories()" [value]="c.id">{{ c.name }}</option>
          </select>
        </div>
        <div class="form-field">
          <label class="form-label">Payment Method *</label>
          <select formControlName="paymentMethod">
            <option *ngFor="let m of paymentMethods" [value]="m">{{ m }}</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">Reference Number</label>
        <input formControlName="referenceNumber" placeholder="UPI txn ID / Cheque # / NEFT ref" />
      </div>

      <div class="form-field">
        <label class="form-label">Notes</label>
        <textarea formControlName="notes" placeholder="Additional notes or details"></textarea>
      </div>

      <div class="btn-group" style="margin-top: 8px;">
        <button type="submit" class="btn btn-primary" [disabled]="loading()">
          {{ loading() ? 'Saving…' : 'Save Expense' }}
        </button>
        <a routerLink="/expenses" class="btn btn-secondary">Cancel</a>
      </div>
    </form>

    <div *ngIf="expenseId" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--color-border);">
      <label class="form-label">Receipt / Attachment</label>
      <input type="file" accept="image/png,image/jpeg,image/webp,application/pdf" (change)="uploadAttachment($event)" style="margin-top: 6px;" />
      <span *ngIf="attachmentUploading()" class="text-muted" style="font-size: 0.85rem;"> Uploading…</span>
      <div *ngIf="attachmentUrl()" style="margin-top: 8px;">
        <a [href]="attachmentUrl()" target="_blank" class="fw-600">📎 View Current Attachment</a>
      </div>
    </div>
    <p *ngIf="!expenseId" class="text-muted" style="font-size: 0.85rem; margin-top: 16px;">
      💡 Save the expense first, then you can attach a receipt image or PDF.
    </p>
  </div>
</div>
