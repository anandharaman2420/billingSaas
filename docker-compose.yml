version: '3.9'

# Full-stack deployment: Postgres + Spring Boot backend + Angular/nginx
# frontend. Secrets are read from environment variables (or a .env file
# next to this one, based on .env.example) - never hardcoded here.
#
#   cp .env.example .env   # fill in real values
#   docker compose up --build
#
# For local development instead of a full container deployment, run
# the backend and frontend directly (see README.md "Running the
# backend" / "Running the frontend") - it's faster to iterate on and
# doesn't require rebuilding an image on every change.

services:
  postgres:
    image: postgres:16-alpine
    container_name: billing-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-billing_saas}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - '5432:5432'
    volumes:
      - billing_saas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-billing_app}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: billing-saas-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-billing_saas}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - generate with: openssl rand -base64 64}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required, e.g. https://yourdomain.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@billingsaas.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Billing SaaS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      UPLOAD_STORAGE_DIRECTORY: /app/uploads
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL:-/api/files}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    volumes:
      - billing_saas_uploads:/app/uploads
    ports:
      - '8080:8080'

  frontend:
    build:
      context: ./frontend
    container_name: billing-saas-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-80}:80'

volumes:
  billing_saas_pgdata:
  billing_saas_uploads:
